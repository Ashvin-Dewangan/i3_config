general {
	colors = true
	interval = 5
	color_good = "#3cd328"
	color_degraded = "#ffd900"
	color_bad = "#fd0303"
	output_format = "i3bar"
	markup = "pango"
}
# order += "read file light"
order += "cpu_temperature 0"
order += "cpu_usage"
order += "memory"
order += "volume master"
order += "wireless wlan0"
order += "wireless wlp3s0"
# order += "bluetooth"
order += "battery 0"
order += "tztime local"

# read file light {
# 	format = "Brightness : %value"
# }

cpu_temperature 0{
	format = "<span foreground='#aca7ee'> %degrees°C </span>"
	max_threshold = 75
	format_above_threshold = "<span foreground='#FF0000'> %degrees°C ⚠️ </span>"
	path = "/sys/devices/platform/coretemp.*/hwmon/hwmon*/temp1_input"
}

cpu_usage {
	format = "<span foreground='#ffffff'> %usage </span>"
	max_threshold = 80
	format_above_threshold = "<span foreground='#FF0000'> %usage ⚠️< /span>"
	degraded_threshold = "40"
	format_above_degraded_threshold = " %usage ⚠️" 
}

memory {
	format = " %free "
	unit = auto
	decimals = 1
	threshold_degraded = 10%
	threshold_critical = 5%
	format_degraded = " %free ⚠️ " 
}

volume master {
        format = "<span foreground='#00eeff'> ♪: %volume </span>"
        format_muted = " ♪: muted "
        device = "default"
        mixer = "Master"
        mixer_idx = 0
}

wireless wlan0 {
	format_up = "󰈀  %essid (%quality)"
	format_down = " 󰈀  "
}

wireless wlp3s0 {
	format_up = "󰤨  %essid (%quality)"
	format_down = "󰤭"
}

battery 0 {
	last_full_capacity = true
    format = "<span foreground='#3cd328'>%status %percentage (%remaining-%emptytime) %consumption</span>"
    format_down = "No battery"
	status_chr = "⚡ CHR"
    status_bat = "🔋 BAT"
    status_unk = "? UNK"
    status_full = "☻ FULL"
    status_idle = "☻ IDLE"
    path = "/sys/class/power_supply/BAT%d/uevent"
    low_threshold = 30
    threshold_type = percentage
}

tztime local{
	format = " %Y-%m-%d %H:%M:%S"
}
