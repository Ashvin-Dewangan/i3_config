general {
	colors = true
	interval = 5
	color_good = "#3cd328"
	color_degraded = "#ffd900"
	color_bad = "#fd0303"
	output_format = "i3bar"
	markup = "pango"
}
# order += "read file light"
order += "cpu_temperature 0"
order += "cpu_usage"
order += "memory"
order += "volume master"
order += "ethernet _first_"
order += "wireless _first_"
# order += "bluetooth"
order += "battery 0"
order += "tztime local"

# read file light {
# 	format = "Brightness : %value"
# }

cpu_temperature 0{
	format = "<span foreground='#958efa'> %degrees°C </span>"
	max_threshold = 75
	format_above_threshold = "<span foreground='#FF0000'> %degrees°C ⚠️ </span>"
	path = "/sys/devices/platform/coretemp.*/hwmon/hwmon*/temp1_input"
}

cpu_usage {
	format = "<span foreground='#ffffff'> %usage </span>"
	max_threshold = 80
	format_above_threshold = "<span foreground='#FF0000'> %usage ⚠️< /span>"
	degraded_threshold = "50"
	format_above_degraded_threshold = " %usage" 
}

memory {
# 	%used represents the percentage of RAM currently occupied by active applications, kernel services, and non-reclaimable buffers, calculated as (total - free - buffers - cache) / total. %available is the percentage of RAM that the kernel estimates can be allocated to new processes without triggering swap, calculated by adding free memory to the portion of cache and buffers that can be instantly reclaimed. 

# In Linux, unused RAM is considered wasted RAM, so the system aggressively uses memory for disk caching to improve performance.  Consequently, a system with a high %used value is not necessarily under pressure; if %available remains high, the kernel can quickly discard cached data to free up space for new applications.  You should monitor %available rather than %used or %free to accurately assess if the system is running out of usable memory. 

# %free: The percentage of RAM that is completely unused and idle.
# %used: The percentage of RAM actively storing data that cannot be easily discarded.
# %available: The percentage of RAM effectively usable by applications, including reclaimable cache. 
	format = " %available"
	unit = auto
	decimals = 1
	threshold_degraded = 10%
	threshold_critical = 5%
	format_degraded = " %free ⚠️ " 
}

volume master {
        format = "<span foreground='#00eeff'> ♪: %volume </span>"
        format_muted = " ♪: muted "
        device = "default"
        mixer = "Master"
        mixer_idx = 0
}

ethernet _first_ {
	format_up = "󰈀  %speed"
	format_down = " 󰈀  "
}

wireless _first_ {
	format_up = "󰤨  %essid %bitrate"
	format_down = " 󰤭  "
}

battery 0 {
	last_full_capacity = true
    format = "<span foreground='#3cd328'>%status %percentage (%remaining-%emptytime) %consumption</span>"
    format_down = "No battery"
	status_chr = "⚡ CHR"
    status_bat = "🔋 BAT"
    status_unk = "? UNK"
    status_full = "☻ FULL"
    status_idle = "☻ IDLE"
    path = "/sys/class/power_supply/BAT%d/uevent"
    low_threshold = 30
    threshold_type = percentage
}

tztime local{
	format = "<span foreground='#ffd478'> %Y-%m-%d %H:%M:%S</span>"
}
